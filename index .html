<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MediCore | Enterprise Pharmacy ERP System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-hospital-user"></i>
                    </div>
                    <div class="logo-text">
                        <span class="logo-name">MediCore</span>
                        <span class="logo-badge">ERP</span>
                    </div>
                </div>
            </div>
            <nav class="nav-menu">
                <a href="#" data-page="dashboard" class="nav-link active"><i class="fas fa-chart-line"></i><span>Dashboard</span></a>
                <a href="#" data-page="medicines" class="nav-link"><i class="fas fa-capsules"></i><span>Medicine Management</span></a>
                <a href="#" data-page="inventory" class="nav-link"><i class="fas fa-warehouse"></i><span>Inventory Intelligence</span></a>
                <a href="#" data-page="pos" class="nav-link"><i class="fas fa-cash-register"></i><span>POS System</span></a>
                <a href="#" data-page="suppliers" class="nav-link"><i class="fas fa-truck"></i><span>Suppliers</span></a>
                <a href="#" data-page="reports" class="nav-link"><i class="fas fa-chart-pie"></i><span>Reports & Analytics</span></a>
                <a href="#" data-page="settings" class="nav-link"><i class="fas fa-sliders-h"></i><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer">
                <div class="ai-panel" id="aiPanel">
                    <div class="ai-header"><i class="fas fa-brain"></i><span>AI Intelligence</span></div>
                    <div class="ai-content"><div class="ai-message" id="aiMessage"><i class="fas fa-chart-line"></i><div><strong>Reorder Alert</strong><p>Analyzing stock levels...</p></div></div></div>
                </div>
            </div>
        </aside>

        <main class="main">
            <header class="top-bar">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                <div class="search-wrapper"><i class="fas fa-search"></i><input type="text" placeholder="Search medicines..." id="globalSearch"></div>
                <div class="actions">
                    <div class="notification-center">
                        <button class="icon-btn" id="notifBtn"><i class="far fa-bell"></i><span class="badge" id="notifBadge">0</span></button>
                        <div class="notif-dropdown" id="notifDropdown"><div class="notif-header">Notifications</div><div class="notif-list" id="notifList"></div></div>
                    </div>
                    <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
                    <div class="user-profile"><img src="https://ui-avatars.com/api/?background=0EA5E9&color=fff&name=Dr+Admin&bold=true" alt="Admin"><div><span>Dr. Admin</span><small>Chief Pharmacist</small></div></div>
                </div>
            </header>
            <div class="content" id="content"></div>
        </main>
    </div>
    <div id="modal" class="modal"></div>
    <div id="toastContainer" class="toast-container"></div>
    <script src="js/app.js"></script>
</body>
</html>
